name: Update card prices

on:
  schedule:
    # 21:30 UTC — tcgcsv.com refreshes daily around 20:00 UTC, this gives a buffer
    - cron: '30 21 * * *'
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab to test

permissions:
  contents: write # needed so the job can commit the updated prices back

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch prices
        run: node scripts/fetch-prices.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "packdrop-price-bot"
          git config user.email "actions@users.noreply.github.com"
          git add prices/
          git diff --cached --quiet && echo "No price changes today." && exit 0
          git commit -m "Update card prices ($(date -u +%Y-%m-%d))"
          git push
